[project]
name = "dart-rag"
version = "0.1.0"
description = "Korean financial-disclosure RAG agent over DART, on GCP free tier with Gemini API."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "google-cloud-bigquery>=3.20",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-storage>=2.16",
    "google-genai>=0.7",
    "httpx>=0.27",
    "lxml>=5.2",
    "tenacity>=8.0",
    "langgraph>=1.1.10",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pdfplumber>=0.11.9",
    "python-multipart>=0.0.27",
    "pykrx>=1.0.45",
    "fredapi>=0.5.2",
    "feedparser>=6.0.11",
    "pandas>=2.2",
    "opendartreader>=0.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

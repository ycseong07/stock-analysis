<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DART 공시 분석</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --fg: #ececec;
      --fg-soft: #b4b4b4;
      --bar-bg: #2f2f2f;
      --bar-border: #4a4a4a;
      --bar-bg-hover: #3a3a3a;
      --pill: #424242;
      --send-bg: #ffffff;
      --send-fg: #0d0d0d;
      --send-bg-disabled: #676767;
      --error: #f4546a;
      --ok: #6cd17e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      min-height: 100vh;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 1em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2em 0;
    }

    h1 {
      font-size: 2em;
      margin: 0 0 0.4em;
      text-align: center;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      text-align: center;
      color: var(--fg-soft);
      margin-bottom: 2em;
      font-size: 1em;
    }

    .composer {
      background: var(--bar-bg);
      border: 1px solid transparent;
      border-radius: 26px;
      padding: 0.45em 0.45em 0.45em 0.55em;
      display: flex;
      align-items: flex-end;
      gap: 0.4em;
      transition: background 0.15s, border-color 0.15s;
    }

    .composer:focus-within {
      background: var(--bar-bg-hover);
    }

    .attach-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }

    .attach-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .attach-btn input {
      display: none;
    }

    .attach-btn svg {
      width: 18px;
      height: 18px;
    }

    .file-chip {
      display: none;
      align-items: center;
      gap: 0.35em;
      background: var(--pill);
      color: var(--fg);
      padding: 0.35em 0.5em 0.35em 0.75em;
      border-radius: 999px;
      font-size: 0.85em;
      max-width: 14em;
      flex-shrink: 0;
      align-self: center;
    }

    .file-chip.visible {
      display: inline-flex;
    }

    .file-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-chip-clear {
      background: none;
      border: none;
      color: var(--fg-soft);
      cursor: pointer;
      padding: 0;
      font-size: 1.15em;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    .file-chip-clear:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--fg);
    }

    .input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    textarea {
      width: 100%;
      max-height: 200px;
      padding: 0.45em 0.2em;
      border: none;
      background: transparent;
      color: var(--fg);
      font-size: 1em;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
      outline: none;
      overflow-y: auto;
    }

    textarea::placeholder {
      color: var(--fg-soft);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--send-bg);
      color: var(--send-fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      transition: opacity 0.15s, background 0.15s;
    }

    .send-btn:disabled {
      background: var(--send-bg-disabled);
      color: var(--bar-bg);
      cursor: not-allowed;
    }

    .send-btn:hover:not(:disabled) {
      opacity: 0.85;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    .examples {
      margin-top: 1.2em;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em;
      justify-content: center;
    }

    .examples button {
      background: transparent;
      border: 1px solid var(--bar-border);
      color: var(--fg-soft);
      padding: 0.4em 0.9em;
      border-radius: 999px;
      font-size: 0.85em;
      cursor: pointer;
    }

    .examples button:hover {
      border-color: var(--fg);
      color: var(--fg);
    }

    .result {
      margin-top: 2em;
      padding: 1.5em;
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      border-radius: 16px;
      display: none;
    }

    .result.visible {
      display: block;
    }

    .meta {
      display: flex;
      gap: 1em;
      flex-wrap: wrap;
      color: var(--fg-soft);
      font-size: 0.82em;
      margin-bottom: 1em;
    }

    .badge {
      padding: 0.2em 0.7em;
      border-radius: 999px;
      border: 1px solid var(--bar-border);
    }

    .badge.faithful-true {
      color: var(--ok);
      border-color: #2a5a32;
    }

    .badge.faithful-false {
      color: var(--error);
      border-color: #6e2935;
    }

    .answer {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .answer .tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      color: var(--fg);
      padding: 0 0.4em;
      border-radius: 4px;
      font-size: 0.78em;
      font-family: ui-monospace, "SF Mono", monospace;
      margin: 0 0.15em;
      cursor: help;
    }

    .citations {
      margin-top: 1.2em;
      padding-top: 1em;
      border-top: 1px solid var(--bar-border);
    }

    .citations h3 {
      font-size: 0.95em;
      margin: 0 0 0.6em;
      color: var(--fg-soft);
      font-weight: 600;
    }

    .citation-card {
      padding: 0.6em 0.8em;
      border-left: 3px solid var(--fg-soft);
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 0.5em;
      font-size: 0.85em;
      border-radius: 0 6px 6px 0;
    }

    .citation-card .head {
      display: flex;
      gap: 0.5em;
      flex-wrap: wrap;
      color: var(--fg-soft);
      font-size: 0.8em;
      margin-bottom: 0.2em;
    }

    .citation-card .head strong {
      color: var(--fg);
    }

    .citation-card .section {
      color: var(--fg);
      word-break: break-word;
    }

    .error {
      color: var(--error);
      padding: 1em;
      border: 1px solid var(--error);
      border-radius: 12px;
      background: rgba(244, 84, 106, 0.08);
      margin-top: 1em;
      display: none;
    }

    .error.visible {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    footer {
      text-align: center;
      color: var(--fg-soft);
      font-size: 0.8em;
      padding: 1.5em 0;
    }

    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 13, 0.85);
      border: 3px dashed var(--fg);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 100;
      font-size: 1.2em;
      color: var(--fg);
    }

    .drop-overlay.visible {
      display: flex;
    }
  </style>
</head>

<body>
  <div class="drop-overlay" id="drop-overlay">파일을 놓으면 첨부됩니다 (PDF · HTML)</div>

  <main>
    <section class="hero">
      <h1>DART 공시 분석</h1>
      <p class="subtitle">한국 상장기업 공시를 쉽게 이해해보세요.</p>

      <form id="form">
        <div class="composer" id="composer">
          <label class="attach-btn" id="attach-label" title="PDF·HTML 첨부">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <input type="file" id="file" accept=".pdf,.html,.htm,application/pdf,text/html">
          </label>

          <span class="file-chip" id="file-chip">
            <span class="file-chip-name" id="file-name"></span>
            <button type="button" class="file-chip-clear" id="file-clear" aria-label="파일 제거">×</button>
          </span>

          <div class="input-wrap">
            <textarea id="query" rows="1" placeholder="무엇이든 물어보세요" required></textarea>
          </div>

          <button type="submit" class="send-btn" id="submit" aria-label="전송">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </form>

      <div class="examples" id="examples">
        <button data-q="삼성전자 2024년 사업보고서의 매출액은?">삼성 2024 매출</button>
        <button data-q="NH투자증권의 2023년 반기 자기자본 비율은?">NH 자기자본</button>
        <button data-q="LG에너지솔루션의 주력 사업 분야를 알려줘">LG엔솔 사업분야</button>
      </div>
    </section>

    <div class="error" id="error"></div>
    <div class="result" id="result">
      <div class="meta" id="meta"></div>
      <div class="answer" id="answer"></div>
      <div class="citations" id="citations" style="display:none">
        <h3>출처</h3>
        <div id="citation-list"></div>
      </div>
    </div>

    <footer>
      이 사이트는 투자에 대한 결정을 내려주지 않습니다.
    </footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const form = $("form"), query = $("query"), file = $("file");
    const submitBtn = $("submit"), result = $("result"), errorBox = $("error");
    const meta = $("meta"), answer = $("answer"), citations = $("citations"), citationList = $("citation-list");
    const fileName = $("file-name"), fileChip = $("file-chip"), fileClear = $("file-clear");
    const dropOverlay = $("drop-overlay");

    const sendIcon = submitBtn.innerHTML;

    const autoGrow = () => {
      query.style.height = "auto";
      query.style.height = Math.min(query.scrollHeight, 200) + "px";
    };
    query.addEventListener("input", autoGrow);

    query.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll("#examples button").forEach(b => {
      b.addEventListener("click", () => {
        query.value = b.dataset.q;
        autoGrow();
        query.focus();
      });
    });

    const isAcceptedFile = (f) => {
      if (!f) return false;
      if (f.type === "application/pdf" || f.type === "text/html") return true;
      return /\.(pdf|html?|htm)$/i.test(f.name);
    };

    const setFile = (f) => {
      if (!isAcceptedFile(f)) {
        errorBox.textContent = "PDF 또는 HTML 파일만 첨부할 수 있습니다.";
        errorBox.classList.add("visible");
        return;
      }
      const dt = new DataTransfer();
      dt.items.add(f);
      file.files = dt.files;
      fileName.textContent = f.name;
      fileChip.classList.add("visible");
      errorBox.classList.remove("visible");
    };

    file.addEventListener("change", () => {
      if (file.files[0]) {
        fileName.textContent = file.files[0].name;
        fileChip.classList.add("visible");
      }
    });

    fileClear.addEventListener("click", () => {
      file.value = "";
      fileName.textContent = "";
      fileChip.classList.remove("visible");
    });

    let dragDepth = 0;
    const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");

    document.addEventListener("dragenter", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragDepth++;
      dropOverlay.classList.add("visible");
    });
    document.addEventListener("dragover", (e) => {
      if (hasFiles(e)) e.preventDefault();
    });
    document.addEventListener("dragleave", (e) => {
      if (!hasFiles(e)) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropOverlay.classList.remove("visible");
    });
    document.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragDepth = 0;
      dropOverlay.classList.remove("visible");
      const f = e.dataTransfer.files[0];
      if (f) setFile(f);
    });

    const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    const renderAnswer = (text) => {
      return escapeHtml(text).replace(/\[corp:([^|\]]+)\|year:(\d{4})\|report:([^|\]]+)\|section:([^|\]]*)\|chunk:([^\]]+)\]/g,
        (_, corp, year, report, section, chunk) =>
          `<span class="tag" title="${escapeHtml(section)} · ${escapeHtml(chunk)}">${escapeHtml(corp)} ${year} ${escapeHtml(report)}</span>`
      );
    };

    const renderCitation = (c) => `
      <div class="citation-card">
        <div class="head">
          <strong>${escapeHtml(c.corp_name)}</strong>
          <span>${c.fiscal_year}</span>
          <span>${escapeHtml(c.report_type)}</span>
        </div>
        <div class="section">${escapeHtml(c.section || "(섹션 없음)")}</div>
      </div>`;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = query.value.trim();
      if (!q) return;

      result.classList.remove("visible");
      errorBox.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>';

      const fd = new FormData();
      fd.append("query", q);
      if (file.files[0]) fd.append("file", file.files[0]);

      try {
        const resp = await fetch("/ask", { method: "POST", body: fd });
        if (!resp.ok) {
          const t = await resp.text();
          throw new Error(`HTTP ${resp.status}: ${t.slice(0, 300)}`);
        }
        const data = await resp.json();
        meta.innerHTML = `
          <span class="badge faithful-${data.faithful}">${data.faithful ? "출처 검증 통과" : "출처 검증 실패"}</span>
          <span>hits ${data.hits}</span>
          <span>retries ${data.retry_count}</span>
          <span>${(data.latency_ms / 1000).toFixed(1)}s</span>`;
        answer.innerHTML = renderAnswer(data.answer);
        if (data.citations.length) {
          citationList.innerHTML = data.citations.map(renderCitation).join("");
          citations.style.display = "block";
        } else {
          citations.style.display = "none";
        }
        result.classList.add("visible");
      } catch (err) {
        errorBox.textContent = `오류: ${err.message}`;
        errorBox.classList.add("visible");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = sendIcon;
      }
    });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 투자 리서치 에이전트</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --fg: #ececec;
      --fg-soft: #b4b4b4;
      --bar-bg: #2f2f2f;
      --bar-border: #4a4a4a;
      --bar-bg-hover: #3a3a3a;
      --pill: #424242;
      --send-bg: #ffffff;
      --send-fg: #0d0d0d;
      --send-bg-disabled: #676767;
      --error: #f4546a;
      --ok: #6cd17e;
      --warn: #f0b86b;
      --link: #6ba6ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.55;
      min-height: 100vh;
    }

    nav.topbar {
      display: flex;
      gap: 1.5em;
      padding: 0.6em 1.2em;
      border-bottom: 1px solid var(--bar-border);
      background: var(--bar-bg);
      align-items: center;
    }
    nav.topbar a {
      color: var(--fg-soft);
      text-decoration: none;
      font-size: 0.95em;
    }
    nav.topbar a.active { color: var(--fg); font-weight: 600; }
    nav.topbar .title { color: var(--fg); font-weight: 600; margin-right: auto; }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr 320px;
      gap: 1.2em;
      padding: 1.2em;
      max-width: 1400px;
      margin: 0 auto;
    }

    aside.sidebar, aside.rightpanel {
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      border-radius: 8px;
      padding: 1em;
      font-size: 0.92em;
    }

    .sidebar h2, .rightpanel h2 {
      font-size: 0.95em;
      color: var(--fg-soft);
      margin: 0 0 0.6em 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .sidebar label {
      display: block;
      margin: 0.6em 0 0.25em;
      color: var(--fg-soft);
      font-size: 0.85em;
    }
    .sidebar select, .sidebar input[type="date"] {
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--bar-border);
      border-radius: 6px;
      padding: 0.5em 0.6em;
      font-size: 0.95em;
    }
    .sidebar button {
      width: 100%;
      margin-top: 1em;
      background: var(--send-bg);
      color: var(--send-fg);
      border: none;
      border-radius: 999px;
      padding: 0.6em 1em;
      font-weight: 600;
      cursor: pointer;
    }
    .sidebar button:disabled {
      background: var(--send-bg-disabled);
      cursor: not-allowed;
    }
    .sidebar .secondary {
      background: transparent;
      color: var(--fg-soft);
      border: 1px solid var(--bar-border);
      margin-top: 0.6em;
    }

    main.main {
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      border-radius: 8px;
      padding: 1.6em 1.8em;
      min-height: 60vh;
    }
    .badges {
      display: flex;
      gap: 0.4em;
      flex-wrap: wrap;
      margin-bottom: 1.2em;
    }
    .badge {
      background: var(--pill);
      color: var(--fg-soft);
      border-radius: 999px;
      padding: 0.18em 0.7em;
      font-size: 0.78em;
    }
    .badge.ok { color: var(--ok); }
    .badge.warn { color: var(--warn); }
    .badge.err { color: var(--error); }

    article#card h1, article#card h2, article#card h3 {
      color: var(--fg);
    }
    article#card h3 { margin-top: 1.4em; }
    article#card ul { padding-left: 1.2em; }
    article#card li { margin: 0.3em 0; }
    article#card code {
      background: var(--pill);
      padding: 0.05em 0.35em;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .empty {
      color: var(--fg-soft);
      text-align: center;
      padding: 4em 1em;
    }

    .rightpanel ul { list-style: none; padding: 0; margin: 0; }
    .rightpanel li {
      padding: 0.55em 0;
      border-bottom: 1px solid var(--bar-border);
      font-size: 0.85em;
    }
    .rightpanel li:last-child { border-bottom: none; }
    .rightpanel .src-id {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--link);
      font-size: 0.75em;
      margin-right: 0.4em;
    }

    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid var(--bar-border);
      border-top-color: var(--fg);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.4em;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <nav class="topbar">
    <span class="title">AI 투자 리서치 에이전트</span>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <h2>분석 조건</h2>
      <label for="stock">종목</label>
      <select id="stock"></select>
      <label for="date">기준 일자 (as_of)</label>
      <input id="date" type="date">
      <button id="generate">카드 생성</button>
      <button id="refresh" class="secondary">새로 생성 (캐시 무시)</button>
      <p id="hint" style="color: var(--fg-soft); font-size: 0.8em; margin-top: 1em;">
        새로 생성 시 약 90초 소요됩니다 (5 LLM 호출).
      </p>
    </aside>

    <main class="main">
      <div class="badges" id="meta-badges"></div>
      <article id="card">
        <div class="empty">좌측에서 종목과 일자를 골라 <strong>카드 생성</strong>을 눌러주세요.</div>
      </article>
    </main>

    <aside class="rightpanel">
      <h2>출처 (fact pack)</h2>
      <ul id="facts">
        <li style="color: var(--fg-soft); border: none;">카드 생성 후 출처가 표시됩니다.</li>
      </ul>
    </aside>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const stockSel = $("stock");
    const dateInp = $("date");
    const genBtn = $("generate");
    const refreshBtn = $("refresh");

    // Default date = today (KST)
    const todayStr = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    dateInp.value = todayStr;
    dateInp.max = todayStr;

    async function loadStocks() {
      const r = await fetch("/stocks");
      const stocks = await r.json();
      stockSel.innerHTML = stocks
        .map(s => `<option value="${s.code}">${s.name} (${s.code})</option>`)
        .join("");
    }

    function setLoading(on) {
      genBtn.disabled = on;
      refreshBtn.disabled = on;
      if (on) {
        $("card").innerHTML = `<div class="empty"><span class="spinner"></span> 카드 생성 중…</div>`;
        $("meta-badges").innerHTML = "";
        $("facts").innerHTML = `<li style="color: var(--fg-soft); border: none;">대기 중…</li>`;
      }
    }

    function renderBadges(card) {
      const items = [
        `<span class="badge">기준일 ${card.as_of}</span>`,
        `<span class="badge">매수 ${card.bullish_count} / 매도 ${card.bearish_count}</span>`,
        card.faithful
          ? `<span class="badge ok">faithful ✓</span>`
          : `<span class="badge err">faithful ✗</span>`,
        card.language_violations_count > 0
          ? `<span class="badge warn">언어 위반 ${card.language_violations_count}</span>`
          : `<span class="badge ok">언어 검증 ✓</span>`,
        card.cached
          ? `<span class="badge">캐시 (${card.generated_at?.slice(0, 19) ?? "?"})</span>`
          : `<span class="badge ok">신규 생성 ${(card.latency_ms / 1000).toFixed(1)}s</span>`,
      ];
      $("meta-badges").innerHTML = items.join(" ");
    }

    function renderCard(md) {
      // marked.parse — basic markdown rendering
      $("card").innerHTML = window.marked ? marked.parse(md) : `<pre>${md}</pre>`;
    }

    function renderFactPack(facts) {
      if (!facts.length) {
        $("facts").innerHTML = `<li style="color: var(--fg-soft); border: none;">출처 없음</li>`;
        return;
      }
      $("facts").innerHTML = facts
        .map(f => `<li><span class="src-id">[${f.id}]</span>${f.sentence}</li>`)
        .join("");
    }

    async function generate(forceRefresh) {
      const code = stockSel.value;
      const asOf = dateInp.value;
      const url = `/research/${code}?as_of=${asOf}` + (forceRefresh ? "&force_refresh=true" : "");

      setLoading(true);
      try {
        const r = await fetch(url, { method: "POST" });
        if (!r.ok) {
          const err = await r.text();
          $("card").innerHTML = `<div class="empty" style="color: var(--error);">에러 ${r.status}: ${err}</div>`;
          return;
        }
        const card = await r.json();
        renderBadges(card);
        renderCard(card.card_markdown);
        renderFactPack(card.fact_pack);
      } catch (e) {
        $("card").innerHTML = `<div class="empty" style="color: var(--error);">네트워크 오류: ${e.message}</div>`;
      } finally {
        setLoading(false);
      }
    }

    genBtn.addEventListener("click", () => generate(false));
    refreshBtn.addEventListener("click", () => generate(true));

    loadStocks();
  </script>
</body>

</html>
